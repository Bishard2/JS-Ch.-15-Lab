<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Feature</title>
</head>
<body>
    <h1>Hello Web Technologies Students!</h1>
    <p>This is a new feature file created on a branch to demonstrate Git Branching and Merging.</p>


    <button onclick="showMessage()">Show Message</button>
    <script>
        function showMessage() {
            let featureDetail = "This feature will allow users to track their progress when doing tutorials on the website. "
            try {                                
                let messageText = "We added a new feature: " + featureDetails;
                alert(messageText);
            } catch (error) {
                alert("An error occurred!\n\n" + error);
                console.error("Error details:", error);
            }
        }
    </script>


</body>
</html>
